[project]
name = "codepilot-agent"
version = "0.1.0"
description = "Multi-agent coding platform: GitHub issues to tested pull requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.5.3",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "nemoguardrails>=0.24.1",
    "pydantic>=2.13.5",
    "pygithub>=2.10.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
